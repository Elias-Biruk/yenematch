services:
  postgres:
    image: postgres:15-alpine
    container_name: yene-match-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yene_match_user
      POSTGRES_PASSWORD: yene_match_password
      POSTGRES_DB: yene_match
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yene_match_user -d yene_match"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
